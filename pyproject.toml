[project]
name = "scirag"
version = "0.1.0"
description = "Hybrid-retrieval RAG over arXiv papers with grounded citations, abstention, and graceful degradation"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tiktoken>=0.7",
    "qdrant-client>=1.9",
    "pymupdf>=1.24",
    "arxiv>=2.1",
    "openai>=1.40",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
# Real models (CPU is fine). CI runs without these using hash/lexical fakes.
models = [
    "sentence-transformers>=2.7",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
scirag = "scirag.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scirag*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["data", "paper-rag-agent-main", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "B905", "SIM103", "SIM105", "SIM905"]

[tool.ruff.lint.isort]
known-first-party = ["scirag"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--tb=short", "-m", "not slow"]
testpaths = ["tests"]
markers = ["slow: needs real embedding/reranker models (skipped in CI)"]
