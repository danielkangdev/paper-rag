# Default configuration. Any key can be overridden with an env var of the form
# SCIRAG__<SECTION>__<KEY>, e.g. SCIRAG__EMBEDDING__PROVIDER=hash.
# Relative paths are resolved against the repository root.

paths:
  data_dir: ./data
  pdf_dir: ./data/pdfs          # downloaded arXiv PDFs; also the only dir MCP ingest may read
  sqlite_path: ./data/scirag.sqlite

embedding:
  provider: sentence-transformers   # sentence-transformers | hash (fake, for tests/CI)
  model_name: BAAI/bge-small-en-v1.5
  dim: 384
  batch_size: 32
  query_instruction: "Represent this sentence for searching relevant passages: "

reranker:
  enabled: true
  provider: cross-encoder           # cross-encoder | lexical (fake, for tests/CI)
  # BAAI/bge-reranker-base measured 21.5 s/query on CPU (30 candidates) vs 1.4 s for this model.
  model_name: cross-encoder/ms-marco-MiniLM-L-6-v2
  candidates: 30                    # how many RRF candidates get re-scored

qdrant:
  url: null                         # e.g. http://localhost:6333; null = embedded local mode
  path: ./data/qdrant
  collection: chunks

chunk:
  target_tokens: 500
  overlap_tokens: 50
  encoding: cl100k_base

retrieve:
  top_k_dense: 30
  top_k_sparse: 30
  rrf_k: 60
  # Per-paper cap for hybrid modes (0 = off). A cap of 2 cut hybrid_rerank Recall@10
  # from 0.667 to 0.402 (eval/results/ablation_2026-11-16_cap2.json): most questions need
  # 2-3 passages from one paper. Diversity is enforced later, at QA evidence selection.
  max_per_paper: 0

abstain:
  enabled: true
  # Thresholds on the top-1 reranker score (sigmoid, 0..1). Calibrated by
  # scripts/calibrate_abstain.py; see eval/results/abstain_calibration.json.
  threshold_low: 0.045
  threshold_high: 0.9125
  # Used only when the reranker is unavailable (degraded mode): dense cosine.
  dense_threshold_low: 0.6341
  dense_threshold_high: 0.7123
  aggregate: max                    # max (top-1) | mean_top3; picked by calibration
  message: "I could not find evidence for this question in the indexed papers, so I won't answer it."

qa:
  max_evidence: 5
  max_per_paper: 3

llm:
  base_url: $OPENAI_BASE_URL
  api_key: $OPENAI_API_KEY
  chat_model: $CHAT_MODEL
  timeout_sec: 60
  max_retries: 2
  temperature: 0.0
  max_tokens: 700

security:
  allow_writes: false               # MCP/API ingest_paper + delete_paper are refused unless true
