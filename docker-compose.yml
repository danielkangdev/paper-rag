services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    build: .
    depends_on:
      - qdrant
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      SCIRAG__QDRANT__URL: http://qdrant:6333
      SCIRAG__SECURITY__ALLOW_WRITES: "true"   # the demo ingests through the API
    volumes:
      - app_data:/app/data
      - hf_models:/models

volumes:
  qdrant_data:
  app_data:
  hf_models:
